<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            display: grid;
            place-items: center;
            height: 100vh;
            color: #1e293b;
        }

        .auth-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 800px;
            max-width: 95%;
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .auth-banner {
            background: linear-gradient(160deg, #22c55e, #06b6d4);
            padding: 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-banner h1 {
            margin-bottom: 10px;
        }

        .auth-form {
            padding: 40px;
        }

        .auth-form h3 {
            margin-bottom: 25px;
            color: #0f172a;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #cbd5f5;
            font-size: 14px;
        }

        .input-box input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6,182,212,0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #0ea5e9;
            border: none;
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0284c7;
        }

        .footer-text {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
        }

        .footer-text a {
            color: #0ea5e9;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .auth-wrapper {
                grid-template-columns: 1fr;
            }

            .auth-banner {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">

        <div class="auth-banner">
            <h1>Welcome Back 👋</h1>
            <p>Access your dashboard securely and manage your account.</p>
        </div>

        <div class="auth-form">
            <h3>Sign in to continue</h3>

            <form action="#" method="POST">

                <div class="input-box">
                    <select name="" id="">
                        <option value="faslk"></option>
                        <option value="sjflasjf"></option>
                    </select>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button class="submit-btn">Login</button>

            </form>

            <div class="footer-text">
                <a href="#">Forgot your password?</a>
            </div>
        </div>

    </div>

</body>
</html>
